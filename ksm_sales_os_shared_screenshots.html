/* KSM Sales OS — v6-inspired green sidebar layout */
:root{--green:#087b4c;--deep:#064d34;--ink:#15251f;--muted:#718277;--bg:#f6faf7;--line:#e3ece6;--mint:#eaf7ef;--shadow:0 7px 30px rgba(9,55,34,.042)}
html,body{max-width:100%;overflow-x:hidden;background:#f5f9f6}
.shell{padding:0;min-height:100vh;background:linear-gradient(135deg,#f6fbf8,#f8fbf9 52%,#eff9f2)}
.appframe.sidebar-layout{max-width:none;min-height:100vh;display:flex;overflow:visible;border:0;border-radius:0;box-shadow:none;background:#f9fcfa}
.side-panel{width:246px;min-width:246px;height:100vh;position:sticky;top:0;z-index:32;background:#fff;border-right:1px solid #e2ece6;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(11,53,33,.018)}
.side-brand{height:90px;display:flex;align-items:center;padding:0 19px 0 23px;border-bottom:1px solid #eaf0ec}
.side-brand .logo{font-size:16px;color:#123325}
.side-brand .mark{border-radius:12px;background:linear-gradient(145deg,#063b2c,#12985e);box-shadow:0 4px 13px rgba(5,91,55,.15)}
.side-nav{flex:1;overflow-y:auto;padding:15px 11px 20px;scrollbar-width:thin;scrollbar-color:#e8efe8 transparent}
.sidebar-group{margin-bottom:18px}
.sidebar-group-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#a1afa6;padding:13px 12px 7px}
.side-nav .navbtn{width:100%;height:43px;padding:0 13px;display:flex;align-items:center;gap:12px;text-align:left;border-radius:10px;background:transparent;color:#607468;font-size:12px;font-weight:650;margin:2px 0;position:relative;transition:background .17s,color .17s,transform .17s;white-space:normal}
.side-nav .navbtn svg{width:17px;height:17px;color:#769287;flex-shrink:0}
.side-nav .navbtn span:nth-of-type(1){flex:1}
.side-nav .navbtn:hover{background:#f1f8f3;color:#08643d;transform:translateX(2px)}
.side-nav .navbtn:hover svg{color:#087f4c}
.side-nav .navbtn.active{background:#e7f6eb;color:#075e39;box-shadow:inset 3px 0 #118c57;font-weight:800}
.side-nav .navbtn.active svg{color:#098552}
.side-notif{flex:0 0 auto !important;width:7px;height:7px;border-radius:50%;background:#0d965b}
.side-footer{border-top:1px solid #eaf0ec;padding:14px 14px 20px}
.side-helper{display:flex;align-items:center;gap:10px;background:#f1f9f3;border:1px solid #e5f2e9;border-radius:12px;padding:11px;margin-bottom:12px}
.side-helper-icon{display:grid;place-items:center;width:30px;height:30px;background:#dff1e5;border-radius:9px;color:#0b7f4b}
.side-helper-icon svg{width:16px;height:16px}
.side-helper b{display:block;font-size:11px;color:#21583b}.side-helper small{display:block;font-size:9px;color:#809688;margin-top:3px}
.side-signout{border:0;background:transparent;display:flex;align-items:center;gap:11px;width:100%;height:38px;padding:0 12px;border-radius:9px;color:#718176;font-size:12px;font-weight:700;text-align:left}
.side-signout:hover{background:#f6f9f6;color:#145f3d}
.side-signout svg{width:17px;height:17px}
.side-close,.side-scrim{display:none}
.workspace{flex:1;min-width:0;display:flex;flex-direction:column}

const fromStore=(k,f='')=>{try{return localStorage.getItem(k)||f}catch{return f}};
const toStore=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const getCompanyLogo=()=>fromStore(STORE.companyLogo,DEFAULT_COMPANY_LOGO);
const getProfileNameStored=()=>fromStore(STORE.profileName,'');
const getProfilePhoto=()=>userState.preferences?.avatar_data||userState.session?.user?.image||fromStore(STORE.profilePhoto,'');
const getTheme=()=>fromStore(STORE.theme,'dark');
const applyTheme=()=>document.documentElement.setAttribute('data-theme',getTheme());
const readFileAsDataURL=(file)=>new Promise((resolve,reject)=>{if(!file)return resolve('');const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('File could not be read'));fr.readAsDataURL(file)});
const optimizedAvatar=async file=>{const src=await readFileAsDataURL(file);const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=src});const c=document.createElement('canvas');const r=Math.min(1,320/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const out=c.toDataURL('image/jpeg',0.72);if(out.length>300000)throw new Error('Picture is too large');return out};

const data={profiles:[],teams:[],team_members:[],leads:[],followups:[],reports:[],attendance:[],templates:[],notifications:[],bonuses:[],attachments:[],loginAudits:[]};

const btn=(name,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${name}</button>`;
const fmt=(n)=>new Intl.NumberFormat('en-US').format(n||0);
const money=n=>'PKR '+fmt(n);
const today=()=>new Date().toISOString().slice(0,10);
const isOwner=()=>['owner','admin'].includes(userState.profile?.role);
const canManage=()=>isOwner()||userState.profile?.role==='manager'||userState.profile?.role==='team_lead';
const canDeleteLead=lead=>{
 if(!lead||userState.profile?.approval_status!=='approved')return false;
 if(isOwner())return true;
 if(userState.profile?.role!=='manager')return false;
 const actor=userState.session?.user?.id;
 if(!actor)return false;
 return lead.owner_id===actor||Boolean(lead.team_id&&data.team_members.some(m=>m.user_id===actor&&m.team_id===lead.team_id));
};
const displayName=()=>userState.profile?.full_name||userState.session?.user?.email?.split('@')[0]||'Team Member';
const userFullName=()=>userState.preferences?.display_name||userState.profile?.full_name||userState.session?.user?.name||getProfileNameStored()||displayName();
const avatarNode=(cls='avatar')=>{const photo=getProfilePhoto();return photo?`<img class="${cls} avatar-img" src="${esc(photo)}" alt="${esc(userFullName())}">`:`<span class="${cls}">${esc(userFullName().slice(0,1).toUpperCase())}</span>`};
const titlecase=s=>s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

const activeLeads=()=>{let rows=data.leads;if(!isOwner()&&userState.profile?.role==='salesperson'){rows=rows.filter(l=>l.owner_id===userState.session?.user?.id)} if(userState.selectedTeam!=='all')rows=rows.filter(l=>l.team_id===userState.selectedTeam); if(userState.search)rows=rows.filter(l=>JSON.stringify(l).toLowerCase().includes(userState.search.toLowerCase()));return rows};
const stat=()=>{const ls=activeLeads(),resp=ls.filter(l=>['replied','interested','negotiation','won'].includes(l.status)).length,won=ls.filter(l=>l.status==='won').length,due=data.followups.filter(f=>!f.sent_at&&f.due_at&&f.due_at.slice(0,10)<=today()&&ls.some(l=>l.id===f.lead_id)).length;return {ls,resp,won,due}};

const chart=(arr,labels=[],name='Outreach trend',mode='line')=>{const vals=arr.length?arr:[0,0,0,0,0,0,0];const max=Math.max(1,...vals);const w=540,h=208,pad=28;const x=i=>pad+i*(w-2*pad)/Math.max(1,vals.length-1),y=v=>h-28-v/max*(h-58);let graphics='';for(let k=0;k<4;k++){const Y=30+k*50;graphics+=`<line x1="28" y1="${Y}" x2="${w-10}" y2="${Y}" stroke="#eaf0f3" stroke-dasharray="3 5"/>`;}if(mode==='bars'){const bw=(w-2*pad)/Math.max(vals.length,1);graphics+=vals.map((v,i)=>`<rect x="${pad+i*bw+bw*.17}" y="${y(v)}" width="${bw*.64}" height="${h-28-y(v)}" rx="8" fill="${i===Math.max(0,vals.length-3)?'#0a8654':'#c5edda'}" data-tip="${esc(labels[i]||`Period ${i+1}`)}: ${v}"/>`).join('')}else{let points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');graphics+=`<polyline points="${points}" stroke="#138752" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="6" fill="#159c6c" stroke="white" stroke-width="2" data-tip="${esc(labels[i]||`Period ${i+1}`)}: ${v}"/>`).join('')};return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(name)}">${graphics}</svg>`};
const timeBuckets=(rows,key='created_at',n=7)=>{const out=Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-n+1+i);return {day:d.toISOString().slice(0,10),value:0}});for(const r of rows){const day=String(r[key]||'').slice(0,10);const match=out.find(x=>x.day===day);if(match)match.value++}return out};
const dbCall=async(table,op,payload)=>{if(!db)throw new Error('Backend is not connected');let q=db.from(tableMap[table]||table);if(op==='insert')q=q.insert(payload).select();else if(op==='update')q=q.update(payload.values).eq('id',payload.id).select();else if(op==='delete')q=q.delete().eq('id',payload.id);const {data:rows,error}=await q;if(error)throw error;return rows};
const playChime=()=>{try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const tone=(freq,start,dur)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.07,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+dur+.02)};const now=ctx.currentTime+.01;tone(740,now,.17);tone(880,now+.12,.22)}catch(e){console.warn('chime',e)}};
const toast=(msg)=>{let el=$('#toast');el.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(userState.toastTimer);userState.toastTimer=setTimeout(()=>el.innerHTML='',3800)};

ure authentication. Please refresh or contact the administrator.</div>`}<div style="margin-top:22px;font-size:11px;color:#9ba5aa">Protected access · Owner-managed team approval</div></div></div></div>`}

const navs=[['overview','Overview'],['outreach','Outreach CRM'],['replied','Replied Clients'],['followups','Follow-ups'],['teams','Teams'],['performance','Performance'],['analytics','Analytics'],['attendance','Attendance'],['reports','Day End Report'],['templates','DM Studio'],['notifications','Notifications'],['approvals','Approvals'],['finance','Finance'],['settings','Settings']];
function shell(){
 const navIcons={overview:'home',outreach:'people',replied:'mail',followups:'clock',teams:'people',performance:'trophy',analytics:'chart',attendance:'calendar',reports:'file',templates:'send',notifications:'bell',approvals:'shield',finance:'settings',settings:'settings'};
 const navGroups=[['WORKSPACE',['overview','outreach','replied','followups']],['MANAGEMENT',['teams','performance','analytics','attendance','reports']],['TOOLS',['templates','notifications','approvals','finance','settings']]];
 const currentPage=navs.find(([key])=>key===userState.page)?.[1]||'Overview';
 const allowed=navs.filter(([p])=>!['approvals','finance'].includes(p)||isOwner());
 const canAccess=p=>allowed.some(([key])=>key===p);
 const sidebar=navGroups.map(([heading,keys])=>{const list=keys.filter(canAccess);if(!list.length)return '';return `<div class="sidebar-group"><div class="sidebar-group-label">${heading}</div>${list.map(p=>{const name=navs.find(([key])=>key===p)?.[1]||p;return `<button type="button" data-page="${p}" class="navbtn ${userState.page===p?'active':''}" ${userState.page===p?'aria-current="page"':''}>${icon(navIcons[p])}<span>${name}</span>${p==='notifications'&&data.notifications.some(n=>!n.read_at)?'<span class="side-notif"></span>':''}</button>`}).join('')}</div>`}).join('');
 const unread=data.notifications.filter(x=>!x.read_at).length;
 return `<div class="shell"><div class="appframe sidebar-layout">
  <aside class="side-panel ${userState.mobileNav?'open':''}" aria-label="KSM navigation">

  </aside>
  ${userState.mobileNav?'<button type="button" class="side-scrim" data-act="toggle-menu" aria-label="Close menu"></button>':''}

    <div class="header-heading"><div class="header-eyebrow">KSM / SALES WORKSPACE</div><strong>${esc(currentPage)}</strong></div>
    <div class="righttools"><span class="header-live"><span class="pulse-dot"></span> Workspace</span><button class="iconbtn" data-page="notifications" aria-label="Notifications">${icon('bell')}${unread?'<span class="notifydot"></span>':''}</button><button class="userbtn" data-page="settings" aria-label="Open settings">${avatarNode()}<span class="hide-phone"><b>${esc(userFullName())}</b><small>${esc(titlecase(userState.profile?.role||'member'))}</small></span></button></div>
   </header><main class="body">${userState.preview?'<div class="lockinfo" style="margin-bottom:17px">Design preview — no demo records or private data. Changes and secure login require a connected Sales OS database.</div>':''}${pages[userState.page]?.()||pages.overview()}</main>
  </div>
 </div></div><div class="tooltip" id="hover-tooltip"></div>${userState.modal?modal():''}`;
} 
const pages={};
pages.overview=()=>{const s=stat(),points=timeBuckets(s.ls),replyPts=timeBuckets(s.ls.filter(l=>['replied','interested','negotiation','won'].includes(l.status)));const goal=data.teams.reduce((a,t)=>a+(t.monthly_target||0),0);return pageHeader('Sales Overview','Real-time team performance, outreach and next actions.',`${btn(icon('plus')+' New outreach','new-lead','primary')} ${btn(icon('download')+' Export','export')}`)+`<div class="grid metrics">${card('Total outreach',fmt(s.ls.length),'Recorded leads',true)}${card('Client replies',fmt(s.resp),s.ls.length?`${(100*s.resp/s.ls.length).toFixed(1)}% reply rate`:'No outreach recorded')}${card('Deals closed',fmt(s.won),'Confirmed client wins')}${card('Follow-ups due',fmt(s.due),'Needs attention')}</div><div class="grid two"><section class="card"><div class="cardhead"><div><h2>Outreach activity</h2><p>Daily lead creation · last 7 days</p></div><span class="badge">Live data</span></div>${chart(points.map(p=>p.value),points.map(p=>p.day),'Daily outreach','line')}</section><section class="card"><div class="cardhead"><div><h2>Monthly team outreach goal</h2><p>Actual outreach vs. target</p></div></div><div style="display:flex;align-items:center;justify-content:space-between;gap:15px"><div><div style="font-size:32px;font-weight:800">${goal?Math.round(100*s.ls.length/goal)+'%':'—'}</div><p>Goal progress</p></div><div style="font-size:22px;font-weight:800;color:#0f8666">${fmt(s.ls.length)} <span style="font-size:12px;color:#99a3ab">/ ${fmt(goal)}</span></div></div><div class="bar"><i style="width:${goal?Math.min(100,s.ls.length/goal*100):0}%"></i></div><p class="smallnote top-progress">Team goals are set by the Owner and calculated from saved records.</p><div style="margin-top:20px">${label('Reply rate',s.ls.length?`${(s.resp/s.ls.length*100).toFixed(1)}%`:'—')}${label('Closures',fmt(s.won))}</div></section></div><div class="grid three"><section class="card"><div class="cardhead"><h3>Today’s priorities</h3><button class="link" data-page="followups">View all</button></div>${s.due?data.followups.filter(f=>!f.sent_at&&f.due_at&&f.due_at.slice(0,10)<=today()).slice(0,5).map(f=>label(`Follow-up #${f.step_number}`,badge('Due'),ts(f.due_at))).join(''):empty('All caught up','No overdue follow-up tasks.')}</section><section class="card"><div class="cardhead"><h3>Pipeline snapshot</h3><button class="link" data-page="outreach">View leads</button></div>${['sent_dm','replied','interested','negotiation','won'].map(st=>label(titlecase(st),`<b>${s.ls.filter(l=>l.status===st).length}</b>`)).join('')}</section><section class="card"><div class="cardhead"><h3>Team progress</h3><button class="link" data-page="teams">Manage teams</button></div>${data.teams.length?data.teams.slice(0,5).map(t=>{const q=s.ls.filter(l=>l.team_id===t.id).length;return `<div class="row"><div class="fill"><b>${esc(t.name)}</b><small>${q} leads · ${t.monthly_target||0} target</small><div class="bar top-progress"><i style="width:${t.monthly_target?Math.min(100,q/t.monthly_target*100):0}%"></i></div></div></div>`}).join(''):empty('No teams yet','Add your first team after Owner approval.')}</section></div><div class="grid two"><section class="card"><div class="cardhead"><h3>Recent outreach</h3><button class="link" data-page="outreach">Open CRM</button></div>${tableLeads(s.ls.slice(0,5),true)}</section><section class="card"><div class="cardhead"><h3>Recent activity</h3><button class="link" data-page="notifications">Notifications</button></div>${data.notifications.length?data.notifications.slice(0,5).map(n=>label(n.title,badge(n.event_type||'Notice'),n.body)).join(''):empty('No notifications','Updates will appear here automatically.')}</section></div>`};
const inlineSelect=(l,key,options)=>`<select class="inline-crm-select" data-inline-field="${key}" data-id="${esc(l.id)}">${options.map(v=>`<option value="${v}" ${l[key]===v?'selected':''}>${esc(titlecase(v))}</option>`).join('')}</select>`;
function tableLeads(rows,compact=false){if(!rows.length)return empty('No outreach records','Add a lead after signing in.');return `<div class="tablebox"><table class="crm-table"><thead><tr><th>Contact / Company</th><th>Platform</th><th>Status</th>${compact?'':'<th>Priority</th><th>Owner</th>'}<th>Updated</th><th>Actions</th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(company(l))}</b><small>${esc(l.contact_name||l.niche||'')}</small></td><td>${compact?esc(titlecase(l.platform||'instagram')):inlineSelect(l,'platform',['instagram','facebook','linkedin','other'])}</td><td>${compact?badge(titlecase(l.status||'new')):inlineSelect(l,'status',['new','sent_dm','replied','interested','negotiation','won','lost'])}</td>${compact?'':`<td>${inlineSelect(l,'priority',['high','medium','low'])}</td><td>${esc(data.profiles.find(p=>p.id===l.owner_id)?.full_name||'—')}</td>`}<td>${ts(l.updated_at||l.created_at)}</td><td><div class="crm-actions"><button class="btn sm" data-act="lead-detail" data-id="${esc(l.id)}">Open</button>${!compact?`<button class="btn sm" data-act="quick-proof" data-id="${esc(l.id)}" data-proof-button="${esc(l.id)}">Upload screenshot</button>${canDeleteLead(l)?`<button class="btn sm danger" data-act="delete-lead" data-id="${esc(l.id)}" title="Permanently delete this lead and linked follow-ups">Delete</button>`:''}`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
const OUTREACH_SHEETS=[['areej','Areej'],['moazzama','Moazzama'],['ahtesham','Ahtesham'],['iqra','Iqra'],['shaheer','Shaheer'],['arsa','Arsa'],['iffat','Iffat']];

const sheetOwner=(key)=>key==='iffat'?(data.profiles.find(p=>String(p.email||'').trim().toLowerCase()==='iffatmashkoorups@gmail.com'&&p.approval_status==='approved')||null):data.profiles.find(p=>p.outreach_sheet_key===key)||data.profiles.find(p=>{if(p.outreach_sheet_key)return false;const name=normalizedName(p.full_name||'');const email=normalizedName((p.email||'').split('@')[0]);return name.includes(key)||email.includes(key)})||null;
pages.outreach=()=>{const isAll=userState.outreachSheet==='all';const selected=OUTREACH_SHEETS.find(([key])=>key===userState.outreachSheet);const profile=selected?sheetOwner(selected[0]):null;const base=activeLeads();let leads=base.filter(l=>userState.leadFilter==='all'||l.status===userState.leadFilter);if(!isAll)leads=profile?leads.filter(l=>l.owner_id===profile.id):[];const tabs=[['all','All Team'],...OUTREACH_SHEETS];return pageHeader('Personal Outreach CRM','Separate outreach sheets for every salesperson.',btn(icon('plus')+' New lead','new-lead','primary'))+`<div class="outreach-sheet-tabs" role="tablist" aria-label="Personal outreach sheets">${tabs.map(([key,name])=>`<button type="button" role="tab" aria-selected="${userState.outreachSheet===key}" class="sheet-tab ${userState.outreachSheet===key?'selected':''}" data-sheet="${key}">${esc(name)}</button>`).join('')}</div><div class="filters"><input class="field" id="lead-search" placeholder="Search contacts, profiles, companies…" value="${esc(userState.search)}"><select class="field" id="stage-filter">${['all','new','sent_dm','replied','interested','negotiation','won','lost'].map(s=>`<option value="${s}" ${userState.leadFilter===s?'selected':''}>${titlecase(s)}</option>`).join('')}</select><span class="badge">${leads.length} leads</span></div><section class="card"><div class="cardhead"><div><h2>${isAll?'Consolidated outreach records':esc(selected?.[1]||'Personal')+' • Outreach sheet'}</h2><p>${isAll?'All accessible team outreach':'Personal contacts, replies, follow-ups and screenshot proof'}</p></div></div>${(!isAll&&!profile)?empty('Account not linked yet',`Assign a team member in Settings to show their records.`):tableLeads(leads.slice(0,250))}${leads.length>250?'<p class="smallnote">Showing the first 250 matching records.</p>':''}</section>`};

pages.replied=()=>{const all=activeLeads(),responded=all.filter(l=>['replied','interested','negotiation','won'].includes(l.status));return pageHeader('Replied Clients','All accessible outreach records — mark client responses and attach message proof.')+`<div class="grid metrics">${card('Total outreach',all.length,'Accessible records',true)}${card('Replied',responded.length,'Responded clients')}${card('Interested',responded.filter(l=>l.status==='interested').length,'Qualified conversations')}${card('Closed',responded.filter(l=>l.status==='won').length,'Confirmed wins')}</div><section class="card"><div class="cardhead"><h2>All outreach conversations</h2><span class="badge">${all.length} records</span></div>${all.length?`<div class="tablebox"><table class="crm-table"><thead><tr><th>Client / Company</th><th>Platform</th><th>Status</th><th>Owner</th><th>Response & Proof</th></tr></thead><tbody>${all.map(l=>`<tr><td><b>${esc(company(l))}</b><small>${esc(l.contact_name||'')}</small></td><td>${esc(titlecase(l.platform||'instagram'))}</td><td>${badge(titlecase(l.status||'new'))}</td><td>${esc(data.profiles.find(p=>p.id===l.owner_id)?.full_name||'—')}</td><td><button class="btn sm green" data-act="got-response" data-id="${esc(l.id)}">${['replied','interested','negotiation','won'].includes(l.status)?'View response / Add proof':'Got response from client'}</button></td></tr>`).join('')}</tbody></table></div>`:empty('No outreach records yet','Add leads from Outreach CRM to start tracking replies.')}</section>`};
const leadOwnerName=l=>{const p=data.profiles.find(p=>p.id===l.owner_id);return p?.full_name||p?.email||'Unassigned'};const myDailyFollowups=()=>{const id=userState.session?.user?.id;const cutoff=new Date(Date.now()-2*86400000);const mine=data.leads.filter(l=>l.owner_id===id&&!['replied','interested','negotiation','won','lost'].includes(l.status));const fresh=mine.filter(l=>new Date(l.created_at)>=cutoff);const due=mine.filter(l=>data.followups.some(f=>f.lead_id===l.id&&!f.sent_at&&f.due_at?.slice(0,10)<=today()));return {fresh,due}};
pages.followups=()=>{const leads=activeLeads();const eligible=leads.filter(l=>!['replied','interested','negotiation','won','lost'].includes(l.status));const sequences=eligible.map(l=>{const steps=data.followups.filter(f=>f.lead_id===l.id).sort((a,b)=>a.step_number-b.step_number);const completed=steps.filter(f=>f.sent_at).length;const next=steps.find(f=>!f.sent_at);return {lead:l,steps,completed,next}}).filter(x=>x.steps.length);const due=sequences.filter(x=>x.next&&!x.next.sent_at&&x.next.due_at?.slice(0,10)===today());const overdue=sequences.filter(x=>x.next&&!x.next.sent_at&&x.next.due_at?.slice(0,10)<today());return pageHeader('Follow-up Center','One client = one sequence, with seven tracked follow-up steps and clear ownership.')+`<section class="card daily-followup-banner"><div><span class="badge">YOUR DAILY FOLLOW-UP BRIEF</span><h2>${myDailyFollowups().due.length} clients need your follow-up today</h2><p>${myDailyFollowups().fresh.length} leads created from your outreach in the past 2 days · Based on assigned owner and scheduled due dates</p></div><button class="btn green" data-page="notifications">Notifications</button></section>`+`<div class="grid metrics">${card('Total scheduled',sequences.length,'Client sequences',true)}${card('Completed',sequences.filter(x=>x.completed===7).length,'All 7 steps completed')}${card('Due today',due.length,'Client sequences requiring action')}${card('Overdue',overdue.length,'Client sequences needing attention')}</div><section class="card"><div class="cardhead"><h2>Client follow-up sequences</h2></div>${sequences.length?`<div class="tablebox"><table><thead><tr><th>Client</th><th>Lead owner</th><th>Progress</th><th>Next due</th><th>Status</th><th>Action</th></tr></thead><tbody>${sequences.slice(0,150).map(x=>`<tr><td>${esc(company(x.lead))}</td><td><b>${esc(leadOwnerName(x.lead))}</b></td><td>${x.completed} / 7 sent</td><td>${x.next?ts(x.next.due_at):'Completed'}</td><td>${badge(x.completed===7?'Complete':x.next?.due_at?.slice(0,10)<today()?'Overdue':'Scheduled')}</td><td>${x.next?`<button class="btn sm green" data-act="followup-toggle" data-id="${esc(x.next.id)}">Follow-up ${x.next.step_number} Done</button> `:""}<button class="btn sm" data-act="followup-history" data-id="${esc(x.lead.id)}">History</button> <button class="btn sm" data-act="lead-detail" data-id="${esc(x.lead.id)}">Manage sequence</button></td></tr>`).join('')}</tbody></table></div>`:empty('No client sequences scheduled','Create a lead to start a seven-step follow-up sequence.')}</section>`};
pages.teams=()=>{const teams=data.teams;return pageHeader('Teams','Manage team ownership, members, targets and performance.',isOwner()?btn(icon('plus')+' Add team','new-team','primary'):'')+`<div class="grid three">${teams.length?teams.map(t=>{const ls=data.leads.filter(l=>l.team_id===t.id),m=data.team_members.filter(x=>x.team_id===t.id);return `<section class="card"><div style="width:44px;height:44px;border-radius:15px;background:linear-gradient(140deg,#cce8ff,#daf8e5);display:grid;place-items:center;color:#0e7565;margin-bottom:17px">${icon('people')}</div><h2>${esc(t.name)}</h2><p>${esc(t.description||'Sales and outreach team')}</p><div class="row"><div class="fill"><b>${m.length} members</b><small>${ls.length} leads · ${t.monthly_target||0} monthly target</small></div><button class="btn sm" data-act="team-detail" data-id="${t.id}">Open ${icon('arrow')}</button></div><div class="bar"><i style="width:${t.monthly_target?Math.min(100,ls.length/t.monthly_target*100):0}%"></i></div></section>`}).join(''):empty('No teams created','Owner can add teams and approve members before assignment.')}</div>${isOwner()?`<section class="card"><div class="cardhead"><h2>Team members</h2><button class="btn sm" data-page="approvals">Manage access</button></div>${data.profiles.length?`<div class="tablebox"><table><thead><tr><th>Member</th><th>Role</th><th>Approval</th><th>Assigned team</th></tr></thead><tbody>${data.profiles.map(p=>`<tr><td><b>${esc(p.full_name||p.email)}</b><small>${esc(p.email)}</small></td><td>${esc(titlecase(p.role))}</td><td>${badge(titlecase(p.approval_status))}</td><td>${esc(data.teams.find(t=>t.id===p.team_id)?.name||'—')}</td></tr>`).join('')}</tbody></table></div>`:empty()}</section>`:''}`};
pages.performance=()=>{const rows=data.profiles.filter(p=>p.approval_status==='approved').map(p=>{const ls=data.leads.filter(l=>l.owner_id===p.id),rep=ls.filter(l=>['replied','interested','negotiation','won'].includes(l.status)).length,won=ls.filter(l=>l.status==='won').length,fs=data.followups.filter(f=>ls.some(l=>l.id===f.lead_id)),done=fs.filter(f=>f.sent_at).length,overdue=fs.filter(f=>!f.sent_at&&f.due_at&&f.due_at.slice(0,10)<today()).length;const score=ls.length?Math.min(100,Math.round(20*Math.min(1,ls.length/50)+25*rep/ls.length+35*Math.min(1,won/3)+20*(fs.length?done/fs.length:0)-Math.min(10,overdue))):0;return {p,ls,rep,won,done,overdue,score}}).sort((a,b)=>b.score-a.score);return pageHeader('Team Performance','Transparent scorecards, follow-up discipline and confirmed wins.',btn(icon('download')+' Export report','export'))+`<div class="grid metrics">${card('Active salespeople',rows.length,'Approved accounts',true)}${card('Total replies',rows.reduce((a,r)=>a+r.rep,0),'Recorded replies')}${card('Clients closed',rows.reduce((a,r)=>a+r.won,0),'Confirmed wins')}${card('Winner bonus','PKR 5,000','Owner-adjustable payout')}</div><section class="card"><div class="cardhead"><h2>Performance leaderboard</h2><span class="badge">Quality-weighted score</span></div>${rows.length?`<div class="tablebox"><table><thead><tr><th>Rank / Member</th><th>Outreach</th><th>Replies</th><th>Wins</th><th>Follow-ups sent</th><th>Overdue</th><th>Score</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${i+1}. ${esc(r.p.full_name||r.p.email)}</b></td><td>${r.ls.length}</td><td>${r.rep}</td><td>${r.won}</td><td>${r.done}</td><td>${r.overdue}</td><td><b>${r.score}%</b><div class="bar" style="margin-top:6px;min-width:100px"><i style="width:${r.score}%"></i></div></td></tr>`).join('')}</tbody></table></div>`:empty('No approved salespeople','Approve team members to enable a verified leaderboard.')}</section>`};

function outreachAssignmentSettings(){

 const intro='<div class="cardhead"><div><h2>Outreach Sheet Assignments</h2><p>Manage which approved team member is linked to each personal outreach sheet.</p></div></div>';
 if(!isOwner())return '<section class="card settings-card">'+intro+'<div class="boxline"><b>Your linked outreach sheet:</b> '+esc(assigned)+'<p class="smallnote">Only the owner can change sheet assignments.</p></div></section>';
 const eligible=data.profiles.filter(p=>p.approval_status==='approved'&&p.role!=='owner');
 const rows=OUTREACH_SHEETS.map(([key,name])=>{
  const member=sheetOwner(key);
  const heading='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px"><strong>'+esc(name)+' · Outreach sheet</strong><span class="smallnote">'+esc(member?.email||'Unassigned')+'</span></div>';
  const control=key==='iffat'
   ? '<div class="smallnote"><strong>'+esc(member?.full_name||'Iffat Mashkoor')+'</strong> · Verified account association (fixed)</div>'
   : '<label style="display:block;margin-bottom:6px;font-weight:700">Linked team member</label><select class="field" data-sheet-link="'+esc(key)+'"><option value="">Select an approved member</option>'+eligible.map(p=>'<option value="'+esc(p.id)+'" '+(member?.id===p.id?'selected':'')+'>'+esc(p.full_name||p.email)+' ('+esc(p.email)+')</option>').join('')+'</select>';
  return '<div class="boxline" style="margin-bottom:10px">'+heading+control+'</div>';
 }).join('');
 return '<section class="card settings-card">'+intro+'<p class="smallnote">Owner only. Reassignments update personal sheet associations without transferring existing leads.</p>'+rows+'</section>';
}

const parseInstagramLead=(value)=>{
 const raw=String(value||'').trim();if(!raw)return null;let handle='';
 if(/^@[A-Za-z0-9._]{1,30}$/.test(raw))handle=raw.slice(1);
 else{try{const u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);
  if(!['instagram.com','www.instagram.com','m.instagram.com','instagr.am','www.instagr.am'].includes(u.hostname.toLowerCase()))return null;
  let parts=u.pathname.split('/').filter(Boolean);if(parts[0]==='_u')parts.shift();handle=(parts[0]||'').replace(/^@/,'');
 }catch(e){return null}}
 if(!/^[A-Za-z0-9._]{1,30}$/.test(handle)||['p','reel','reels','stories','explore','direct','tv','share','accounts','about'].includes(handle.toLowerCase()))return null;
 return {handle,profile_url:'https://www.instagram.com/'+handle+'/'};
};
const normalizeInstagramUrl=v=>{const p=parseInstagramLead(v);return p?p.profile_url.toLowerCase():null};
function applyInstagramAutofill(source){
 const form=document.querySelector('#lead-form');if(!form)return;
 const input=form.querySelector('#instagram-smart'),hint=form.querySelector('#instagram-smart-hint'),match=parseInstagramLead(source);
 if(!match){if(hint){hint.textContent=String(source||'').trim()?'Paste a valid Instagram profile or @handle (not a Reel/post).':'Paste an Instagram profile to extract its handle.';hint.style.color=''}return}
 const contact=form.querySelector('[name="contact_name"]'),url=form.querySelector('[name="profile_url"]'),platform=form.querySelector('[name="platform"]'),type=form.querySelector('[name="outreach_type"]');
 if(contact&&(!contact.value.trim()||contact.dataset.autofilled==='yes')){contact.value=match.handle;contact.dataset.autofilled='yes'}
 if(url)url.value=match.profile_url;if(platform)platform.value='instagram';if(type&&!type.dataset.userEdited)type.value='warm';
 if(input&&document.activeElement!==input)input.value=match.profile_url;
 const dupe=data.leads.some(l=>normalizeInstagramUrl(l.profile_url)===match.profile_url.toLowerCase());
 if(hint){hint.textContent=dupe?'Possible duplicate: profile exists in accessible records.':'Detected @'+match.handle+' — fields filled automatically.';hint.style.color=dupe?'#b45309':'#08794c'}
}

const PROOF_KEY='ksm_sales_proof_';
const cloudProofCache=new Map();
const proofItemsFor=id=>{
 if(!id)return [];
 if(cloudProofCache.has(id))return cloudProofCache.get(id);
 try{const arr=JSON.parse(localStorage.getItem(PROOF_KEY+id)||'[]');return Array.isArray(arr)?arr.filter(x=>x&&typeof x.data==='string'):[]}
 catch{return []}
};
const isLeadProof=id=>!!data.leads.some(l=>l.id===id);
async function syncProofs(id){
 if(!isLeadProof(id)||!db||!userState.session?.user?.id)return;
 const {data:rows,error}=await db.from('sales_proof_images').select('id,image_data,mime_type,uploaded_by,created_at').eq('lead_id',id).order('created_at',{ascending:true}).limit(150);
 if(error)throw new Error('Could not read shared screenshots: '+error.message);
 const items=(rows||[]).map(r=>({id:r.id,data:r.image_data,name:'screenshot-'+r.id+'.'+(r.mime_type==='image/png'?'png':'jpg'),cloud:true}));
 let local=[];
 try{local=JSON.parse(localStorage.getItem(PROOF_KEY+id)||'[]')}catch{}
 if(!Array.isArray(local))local=[];
 let migrated=0;
 for(const old of local){
  if(!old||!safeProofSrc(old.data)||items.some(x=>x.data===old.data))continue;
  if(new Blob([old.data]).size>1450000)continue;
  const mime=old.data.slice(5,old.data.indexOf(';'));
  const {data:inserted,error:insertError}=await db.from('sales_proof_images').insert({lead_id:id,uploaded_by:userState.session.user.id,image_data:old.data,mime_type:mime}).select('id,created_at').single();
  if(insertError){console.warn('Local screenshot migration pending',insertError);continue}
  items.push({id:inserted.id,data:old.data,name:old.name||'screenshot.png',cloud:true});migrated++;
 }
 // Never clear a local screenshot until it is confirmed present in cloud storage.
 const pending=local.filter(x=>x&&safeProofSrc(x.data)&&!items.some(i=>i.data===x.data));
 try{if(pending.length)localStorage.setItem(PROOF_KEY+id,JSON.stringify(pending));else localStorage.removeItem(PROOF_KEY+id)}catch{}
 cloudProofCache.set(id,items.concat(pending.map(x=>({...x,pending:true}))));
 if(migrated)toast(migrated+' existing screenshot(s) synced to team cloud');
}
const safeProofSrc=v=>typeof v==='string'&&/^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=\s]+$/i.test(v)?v:'';

 }

};

async function saveProof(file){
 if(!file||!/^image\/(?:png|jpeg|webp|gif)$/i.test(file.type))return toast('Select PNG, JPG, GIF or WebP');
 if(file.size>1000000)return toast('Screenshot must be smaller than 1 MB for secure sharing');
 const id=userState.focusLead;
 if(!id||!['quick-proof','lead-detail'].includes(userState.modal))return toast('Open the screenshot window first');
 if(!isLeadProof(id))return toast('Follow-up proof needs a linked lead before cloud upload');
 const url=await readFileAsDataURL(file);
 if(new Blob([url]).size>1450000)return toast('Screenshot data too large for shared storage');
 try{
  await syncProofs(id);
  if(proofItemsFor(id).some(x=>x.data===url))return toast('Screenshot already attached to this lead');
  const {error}=await db.from('sales_proof_images').insert({lead_id:id,uploaded_by:userState.session.user.id,image_data:url,mime_type:file.type});
  if(error)throw error;
  cloudProofCache.delete(id);await syncProofs(id);
  userState.proofIndex=proofItemsFor(id).length-1;
  await loadProof(id);refreshProofButtons();toast('Screenshot shared with authorized team');
 }catch(e){console.error(e);toast('Cloud upload failed: '+e.message)}
}

 if(act==='export'){const ls=activeLeads();const columns=['contact_name','company','platform','outreach_type','status','priority','source_url','profile_url'];const csv=[columns.join(','),...ls.map(r=>columns.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const obj=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=obj;a.download='ksm-sales-outreach.csv';a.click();setTimeout(()=>URL.revokeObjectURL(obj),1000);return}
 
 }catch(e){toast('Error: '+e.message)}}
async function submitForm(form){if(form.id==='profile-settings-form'){try{const name=(form.querySelector('[name="full_name"]')?.value||'').trim();if(!name)return toast('Enter a name');const id=userState.session?.user?.id;if(!id||!db)return toast('Sign in first');let image=userState.preferences?.avatar_data||null;const file=form.querySelector('[name="profile_photo"]')?.files?.[0];if(file){if(!file.type.startsWith('image/')||file.size>2000000)throw new Error('Use a JPG, PNG or WebP smaller than 2 MB');image=await optimizedAvatar(file)}const payload={user_id:id,display_name:name,avatar_data:image,updated_at:new Date().toISOString()};const exists=await db.from('sales_user_preferences').select('user_id').eq('user_id',id).maybeSingle();if(exists.error)throw exists.error;const result=exists.data?await db.from('sales_user_preferences').update(payload).eq('user_id',id):await db.from('sales_user_preferences').insert(payload);if(result.error)throw result.error;userState.preferences=payload;toStore(STORE.profileName,name);if(image)toStore(STORE.profilePhoto,image);render();toast('Profile saved across devices')}catch(e){toast('Profile could not save: '+e.message)}return}if(form.id==='company-settings-form'){try{if(!isOwner())return toast('Only the owner can update the company logo');const file=form.querySelector('[name="company_logo"]')?.files?.[0];if(!file)return toast('Choose a logo first');const dataUrl=await readFileAsDataURL(file);toStore(STORE.companyLogo,dataUrl);render();toast('Company logo updated')}catch(e){toast('Cannot save company logo: '+e.message)}return}if(!db||userState.preview)return toast('Secure database is not connected');const fields=Object.fromEntries(new FormData(form).entries());try{if(form.id==='lead-form'){
 const smart=(fields.instagram_smart||'').trim();const parsed=smart?parseInstagramLead(smart):parseInstagramLead(fields.profile_url);
 if(smart&&!parsed)throw new Error('Use a valid Instagram profile URL or @handle');
 if(parsed){fields.profile_url=parsed.profile_url;fields.platform='instagram';if(!fields.contact_name.trim())fields.contact_name=parsed.handle}
 if(!fields.contact_name?.trim())throw new Error('Client / Contact is required');
 const canonical=normalizeInstagramUrl(fields.profile_url);
 if(canonical&&data.leads.some(l=>normalizeInstagramUrl(l.profile_url)===canonical))throw new Error('Duplicate Instagram profile already exists in your accessible leads');
 const dmSent=Boolean(form.querySelector('#lead-dm-sent')?.checked);
 delete fields.instagram_smart;delete fields.dm_sent;
 const payload={...fields,owner_id:isOwner()?(fields.owner_id||userState.session.user.id):userState.session.user.id,team_id:null,status:dmSent?'sent_dm':'new',notes:fields.notes||null};const {data:created,error:createErr}=await db.rpc('sales_create_outreach_lead',{p_payload:payload});if(createErr)throw createErr;if(!created||!created.id)throw new Error('The database did not confirm the saved lead');toast('Lead and 7-step plan created')}else if(form.id==='team-form'){await dbCall('teams','insert',{...fields,monthly_target:Number(fields.monthly_target)||0});toast('Team added')}else if(form.id==='approval-form'){if(!isOwner())throw new Error('Owner role required');await dbCall('profiles','update',{id:userState.focusLead,values:{approval_status:fields.approval_status,role:fields.role}});toast('Approval saved')}else if(form.id==='report-form'){for(const k of ['cold_dms','warm_dms','replies','followups','interested'])fields[k]=Number(fields[k])||0;await dbCall('day_end_reports','insert',{...fields,user_id:userState.session.user.id});toast('Day-end report submitted')}else if(form.id==='template-form'){await dbCall('dm_templates','insert',{...fields,created_by:userState.session.user.id});toast('Template saved')}await getData();userState.modal=null;render()}catch(e){const err=document.querySelector('#approval-error');if(err)err.textContent='Could not save: '+e.message;toast('Cannot save: '+e.message)}}
function render(){const activeForm=document.querySelector('#lead-form');const leadDraft=activeForm?Array.from(activeForm.elements).filter(el=>el.name).map(el=>({name:el.name,value:el.value})):null;const app=$('#app');if(userState.loading){app.innerHTML=loadingScreen();return}if(!userState.session){app.innerHTML=login();return}if(userState.profileLoadError||!userState.profile){app.innerHTML=profileUnavailable();return}if(userState.profile.approval_status!=='approved'){app.innerHTML=pending();return}app.innerHTML=shell();refreshProofButtons();if(leadDraft&&userState.modal==='new-lead'){const f=document.querySelector('#lead-form');if(f){for(const item of leadDraft){const el=Array.from(f.elements).find(x=>x.name===item.name);if(el)el.value=item.value}}}}
async function init(){applyTheme();try{const mod=await import('https://esm.sh/@neondatabase/neon-js@0.9.0-beta?bundle');db=mod.createClient({auth:{url:C.neonAuthUrl},dataApi:{url:C.neonDataApiUrl}});connected=true;}catch(e){backendError=e.message;console.error('Neon SDK loading failed',e)}await loadIdentity();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db&&!userState.modal)loadIdentity()})}
document.addEventListener('click',ev=>{const sheet=ev.target.closest('[data-sheet]');if(sheet){userState.outreachSheet=sheet.dataset.sheet;render();return}const nav=ev.target.closest('[data-page]');if(nav){ev.preventDefault();navigate(nav.dataset.page);return}const action=ev.target.closest('[data-act]');if(action){const a=action.dataset.act;if(a==='close-modal'&&action.classList.contains('dialog-back')&&ev.target!==action)return;ev.preventDefault();runAction(a,action)}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(form.id==='login-form'){ev.preventDefault();if(!db)return toast('Authentication requires the separate Sales OS project');const email=$('#email').value.trim();if(!email)return toast('Enter your email first');userState.loginEmail=email;userState.loginSending=true;userState.loginMagicSent=false;render();try{const {error}=await db.auth.signIn.magicLink({email,callbackURL:location.origin,newUserCallbackURL:location.origin});if(error)throw error;userState.loginMagicSent=true;toast('Check your email for the secure sign-in link')}catch(e){toast('Could not send Magic Link: '+e.message)}finally{userState.loginSending=false;render()}}else{ev.preventDefault();await submitForm(form)}});
document.addEventListener('change',async ev=>{const e=ev.target;if(e.dataset.inlineField){const field=e.dataset.inlineField,id=e.dataset.id;const row=data.leads.find(l=>l.id===id);const old=row?.[field];e.disabled=true;try{await dbCall('leads','update',{id,values:{[field]:e.value}});if(row)row[field]=e.value;toast('Saved')}catch(err){e.value=old||'';toast('Update failed: '+err.message)}finally{e.disabled=false}return}if(e.id==='quick-proof-file'&&e.files[0]){await saveProof(e.files[0]);return}if(e.dataset.sheetLink){if(!isOwner())return toast('Owner access required');const key=e.dataset.sheetLink;const member=e.value;if(!member)return toast('Select an approved member');const existing=data.profiles.find(p=>p.outreach_sheet_key===key);try{if(existing&&existing.id!==member)await dbCall('profiles','update',{id:existing.id,values:{outreach_sheet_key:null}});await dbCall('profiles','update',{id:member,values:{outreach_sheet_key:key}});await getData();render();toast('Sheet linked to member')}catch(err){toast('Could not link member: '+err.message)}return}if(e.id==='team-filter'){userState.selectedTeam=e.value;render()}if(e.id==='stage-filter'){userState.leadFilter=e.value;render()}if(e.id==='proof-file'&&e.files[0])saveProof(e.files[0])});
let debounce;document.addEventListener('input',ev=>{const e=ev.target;if(e.id==='instagram-smart'||(e.id==='f-profile_url'&&document.querySelector('#lead-form')))applyInstagramAutofill(e.value);if(e.id==='f-contact_name'&&e.isTrusted)e.dataset.autofilled='no';if(e.id==='f-outreach_type')e.dataset.userEdited='yes';if(e.id==='lead-search'){clearTimeout(debounce);debounce=setTimeout(()=>{userState.search=e.value;render();const inp=$('#lead-search');inp?.focus();inp?.setSelectionRange(inp.value.length,inp.value.length)},280)}});
document.addEventListener('paste',ev=>{if(!['lead-detail','quick-proof'].includes(userState.modal))return;const file=[...(ev.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'))?.getAsFile();if(file){ev.preventDefault();saveProof(file)}});
document.addEventListener('mousemove',ev=>{const node=ev.target.closest('[data-tip]'),tip=$('#hover-tooltip');if(!tip)return;if(!node){tip.style.display='none';return}tip.style.display='block';tip.textContent=node.dataset.tip;tip.style.left=Math.min(window.innerWidth-170,ev.clientX+12)+'px';tip.style.top=Math.max(8,ev.clientY-40)+'px'});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&userState.modal){userState.modal=null;render()}});
window.KSMSales={get connected(){return connected}};
init();
})();
</script></body></html>
